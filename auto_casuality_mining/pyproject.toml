[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causality_mining"
version = "0.1.0"
description = "Curate causal graphs from heterogeneous timeseries and run event-driven causal inference."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "auto_casuality_mining" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "dowhy>=0.14",
    "python-dotenv>=1.2.2",
    "tqdm>=4.66",
    "shap>=0.44",
    "lightgbm>=4.3",
    "mermaid-py>=0.8.4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["causality_mining*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"
