[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smt-solver-guardrail"
version = "0.1.0"
description = "FastAPI guardrail that checks LLM-generated content against grounding using a typed description-logic IR and Z3."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "z3-solver>=4.12",
    "pydantic-ai-slim[openai]>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["guardrail*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"
